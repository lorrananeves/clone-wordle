    <style>
        /* ── Layout específico da página de arquivo ─────────────────── */
        body {
            height: auto;
            min-height: 100dvh;
            overflow-y: auto;
        }

        .arquivo-container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            box-sizing: border-box;
        }

        .arquivo-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .arquivo-header h1 {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            letter-spacing: 3px;
            margin: 0 0 8px;
        }

        .arquivo-header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 0;
        }

        .arquivo-filtro-wrap {
            margin-bottom: 16px;
        }

        #arquivo-filtro {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        #arquivo-filtro:focus {
            border-color: var(--text-muted);
        }

        #arquivo-filtro::placeholder {
            color: var(--text-muted);
        }

        .arquivo-table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .arquivo-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        .arquivo-table thead th {
            background: var(--surface);
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 1px;
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .arquivo-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background-color 0.1s;
        }

        .arquivo-table tbody tr:last-child {
            border-bottom: none;
        }

        .arquivo-table tbody tr:hover {
            background: var(--surface);
        }

        .arquivo-table td {
            padding: 10px 14px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .arquivo-table td.palavra {
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text);
        }

        .arquivo-back {
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .arquivo-back:hover {
            color: var(--text);
        }
    </style>
</head>

<body>
    <header>
        <a href="./index.html" class="header-btn" aria-label="Voltar ao Xingo" title="Voltar ao Xingo">←</a>
        <h1 id="title">ARQUIVO</h1>
        <div class="header-right">
            <button id="btn-tema" class="header-btn" aria-label="Ativar modo claro" title="Modo claro">☀️</button>
        </div>
    </header>

    <div class="arquivo-container">

        <div class="arquivo-header">
            <h1>Respostas anteriores</h1>
            <p>Todas as palavras do <strong>Xingo</strong>, <strong>Xinguinho</strong> e <strong>Xingão</strong> desde janeiro de 2024.</p>
        </div>

        <div class="arquivo-filtro-wrap">
            <input
                id="arquivo-filtro"
                type="search"
                placeholder="Buscar por data (ex: 15/03/2024) ou palavra (ex: burro)…"
                aria-label="Filtrar arquivo por data ou palavra"
                autocomplete="off"
                spellcheck="false"
            >
        </div>

        <div class="arquivo-table-wrap">
            <table class="arquivo-table" aria-label="Arquivo de respostas do Xingo">
                <thead>
                    <tr>
                        <th scope="col">Data</th>
                        <th scope="col">Xingo <span style="font-weight:400">(5)</span></th>
                        <th scope="col">Xinguinho <span style="font-weight:400">(4)</span></th>
                        <th scope="col">Xingão <span style="font-weight:400">(6)</span></th>
                    </tr>
                </thead>
                <tbody id="arquivo-tbody">
                    <!-- preenchido por js/arquivo.js -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="./js/sw-register.js"></script>
    <script type="module" src="./js/arquivo.js"></script>

    <!-- Tema: reaproveita a lógica do jogo principal -->
    <script>
    (function () {
        var saved = localStorage.getItem('xingo_tema');
        if (saved === 'light') document.body.classList.add('light');

        var btn = document.getElementById('btn-tema');
        if (btn) {
            btn.addEventListener('click', function () {
                document.body.classList.toggle('light');
                var isLight = document.body.classList.contains('light');
                localStorage.setItem('xingo_tema', isLight ? 'light' : 'dark');
                btn.setAttribute('aria-label', isLight ? 'Ativar modo escuro' : 'Ativar modo claro');
                btn.title = isLight ? 'Modo escuro' : 'Modo claro';
            });
            var isLight = document.body.classList.contains('light');
            btn.setAttribute('aria-label', isLight ? 'Ativar modo escuro' : 'Ativar modo claro');
            btn.title = isLight ? 'Modo escuro' : 'Modo claro';
        }
    })();
    </script>

    <!-- Consentimento LGPD — carrega analytics só após aceite do usuário -->
    <script src="./js/consent.js"></script>
</body>
</html>
