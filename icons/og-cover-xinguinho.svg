<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .title { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-weight: 900; letter-spacing: 12px; fill: #ffffff; }
      .sub   { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-weight: 400; fill: #818384; letter-spacing: 1px; }
      .tag   { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-weight: 700; fill: #538d4e; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#131213"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e1e1e" stroke-width="1"/>

  <!-- ═══ LEFT SIDE — mini board 4 cols, centred in left half ═══ -->
  <!-- Row 1: all correct (green) -->
  <rect x="120" y="130" width="78" height="78" rx="6" fill="#538d4e"/>
  <rect x="208" y="130" width="78" height="78" rx="6" fill="#538d4e"/>
  <rect x="296" y="130" width="78" height="78" rx="6" fill="#538d4e"/>
  <rect x="384" y="130" width="78" height="78" rx="6" fill="#538d4e"/>
  <text x="159" y="181" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">X</text>
  <text x="247" y="181" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">I</text>
  <text x="335" y="181" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">N</text>
  <text x="423" y="181" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">O</text>

  <!-- Row 2: mixed -->
  <rect x="120" y="218" width="78" height="78" rx="6" fill="#b59f3b"/>
  <rect x="208" y="218" width="78" height="78" rx="6" fill="#3a3a3c"/>
  <rect x="296" y="218" width="78" height="78" rx="6" fill="#538d4e"/>
  <rect x="384" y="218" width="78" height="78" rx="6" fill="#b59f3b"/>
  <text x="159" y="269" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">B</text>
  <text x="247" y="269" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">O</text>
  <text x="335" y="269" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">N</text>
  <text x="423" y="269" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#ffffff">A</text>

  <!-- Row 3: all absent -->
  <rect x="120" y="306" width="78" height="78" rx="6" fill="#3a3a3c"/>
  <rect x="208" y="306" width="78" height="78" rx="6" fill="#3a3a3c"/>
  <rect x="296" y="306" width="78" height="78" rx="6" fill="#3a3a3c"/>
  <rect x="384" y="306" width="78" height="78" rx="6" fill="#3a3a3c"/>
  <text x="159" y="357" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#818384">P</text>
  <text x="247" y="357" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#818384">A</text>
  <text x="335" y="357" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#818384">T</text>
  <text x="423" y="357" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="38" fill="#818384">O</text>

  <!-- Row 4: empty -->
  <rect x="120" y="394" width="78" height="78" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="208" y="394" width="78" height="78" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="296" y="394" width="78" height="78" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="384" y="394" width="78" height="78" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>

  <!-- ═══ RIGHT SIDE — text ═══ -->
  <text x="660" y="210" class="tag" font-size="22">JOGO DIÁRIO DE PALAVRAS</text>
  <text x="648" y="310" class="title" font-size="82">XINGUINHO</text>
  <line x1="648" y1="338" x2="1120" y2="338" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="650" y="378" class="sub" font-size="22">4 letras. 5 tentativas. Rápido e sem piedade.</text>
  <text x="650" y="408" class="sub" font-size="22">Uma palavra nova todo dia, à meia-noite.</text>

  <!-- Mode pills -->
  <rect x="650" y="450" width="140" height="40" rx="8" fill="#538d4e"/>
  <text x="720" y="476" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="18" fill="#ffffff">4 letras</text>

  <rect x="804" y="450" width="140" height="40" rx="8" fill="#1e1e1e" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="874" y="476" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="18" fill="#818384">5 letras</text>

  <rect x="958" y="450" width="140" height="40" rx="8" fill="#1e1e1e" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="1028" y="476" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="18" fill="#818384">6 letras</text>

  <text x="650" y="550" class="sub" font-size="18">lorrananeves.github.io/clone-wordle</text>
</svg>
