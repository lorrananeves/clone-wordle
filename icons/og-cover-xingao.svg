<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .title { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-weight: 900; letter-spacing: 14px; fill: #ffffff; }
      .sub   { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-weight: 400; fill: #818384; letter-spacing: 1px; }
      .tag   { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-weight: 700; fill: #538d4e; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#131213"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e1e1e" stroke-width="1"/>

  <!-- ═══ LEFT SIDE — mini board 6 cols ═══ -->
  <!-- Row 1: all correct (green) -->
  <rect x="48"  y="120" width="66" height="66" rx="6" fill="#538d4e"/>
  <rect x="124" y="120" width="66" height="66" rx="6" fill="#538d4e"/>
  <rect x="200" y="120" width="66" height="66" rx="6" fill="#538d4e"/>
  <rect x="276" y="120" width="66" height="66" rx="6" fill="#538d4e"/>
  <rect x="352" y="120" width="66" height="66" rx="6" fill="#538d4e"/>
  <rect x="428" y="120" width="66" height="66" rx="6" fill="#538d4e"/>
  <text x="81"  y="167" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">X</text>
  <text x="157" y="167" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">I</text>
  <text x="233" y="167" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">N</text>
  <text x="309" y="167" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">G</text>
  <text x="385" y="167" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">Ã</text>
  <text x="461" y="167" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">O</text>

  <!-- Row 2: mixed -->
  <rect x="48"  y="196" width="66" height="66" rx="6" fill="#b59f3b"/>
  <rect x="124" y="196" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <rect x="200" y="196" width="66" height="66" rx="6" fill="#538d4e"/>
  <rect x="276" y="196" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <rect x="352" y="196" width="66" height="66" rx="6" fill="#b59f3b"/>
  <rect x="428" y="196" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <text x="81"  y="243" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">B</text>
  <text x="157" y="243" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">U</text>
  <text x="233" y="243" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">N</text>
  <text x="309" y="243" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">D</text>
  <text x="385" y="243" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">Ã</text>
  <text x="461" y="243" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#ffffff">O</text>

  <!-- Row 3: all absent -->
  <rect x="48"  y="272" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <rect x="124" y="272" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <rect x="200" y="272" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <rect x="276" y="272" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <rect x="352" y="272" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <rect x="428" y="272" width="66" height="66" rx="6" fill="#3a3a3c"/>
  <text x="81"  y="319" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#818384">P</text>
  <text x="157" y="319" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#818384">A</text>
  <text x="233" y="319" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#818384">T</text>
  <text x="309" y="319" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#818384">I</text>
  <text x="385" y="319" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#818384">F</text>
  <text x="461" y="319" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="32" fill="#818384">O</text>

  <!-- Row 4: empty tiles -->
  <rect x="48"  y="348" width="66" height="66" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="124" y="348" width="66" height="66" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="200" y="348" width="66" height="66" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="276" y="348" width="66" height="66" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="352" y="348" width="66" height="66" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>
  <rect x="428" y="348" width="66" height="66" rx="6" fill="none" stroke="#3a3a3c" stroke-width="2"/>

  <!-- ═══ RIGHT SIDE — text ═══ -->
  <text x="660" y="210" class="tag" font-size="22">JOGO DIÁRIO DE PALAVRAS</text>
  <text x="648" y="315" class="title" font-size="96">XINGÃO</text>
  <line x1="648" y1="343" x2="1120" y2="343" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="650" y="383" class="sub" font-size="22">6 letras. 7 tentativas. Mais brabo.</text>
  <text x="650" y="413" class="sub" font-size="22">Uma palavra nova todo dia, à meia-noite.</text>

  <!-- Mode pills -->
  <rect x="650" y="450" width="140" height="40" rx="8" fill="#1e1e1e" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="720" y="476" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="18" fill="#818384">4 letras</text>

  <rect x="804" y="450" width="140" height="40" rx="8" fill="#1e1e1e" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="874" y="476" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="18" fill="#818384">5 letras</text>

  <rect x="958" y="450" width="140" height="40" rx="8" fill="#538d4e"/>
  <text x="1028" y="476" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="700" font-size="18" fill="#ffffff">6 letras</text>

  <text x="650" y="550" class="sub" font-size="18">lorrananeves.github.io/clone-wordle</text>
</svg>
